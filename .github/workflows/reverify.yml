name: Re-verify catalog

# Runs every catalog check on every entry, so link rot, or a repository rewritten after its entry
# was merged, shows up as a failed run instead of going unnoticed. It only reads the repository:
# no secrets, no write permissions. GitHub runs scheduled workflows from the default branch only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverify:
    name: Check every URL and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check that every URL responds
        run: npm run catalog:verify

      - name: Check that every manifest file exists
        if: ${{ !cancelled() }}
        run: npm run catalog:structure
